      const s=S[r.school];
      let det=[];
      det.push(s.town+(s.students!=null?`・${s.students} 人（${s.students_year} 學年）`:'・學生數：查不到校別資料'));
      if(r.walk_km!=null && r.walk_km<=6) det.push(`步行 ${r.walk_km} 公里約 ${r.walk_min} 分鐘`);
      h+=`<div class="row"><div class="nm">${esc(r.school)}</div>${dist(r)}<div class="det">${det.join('；')}${s.note?'<br>'+esc(s.note):''}</div></div>`;
    });
    h+='</div>';
  });
  h+=`<div class="card muted">起點是「${esc(v.name)}」內${esc(v.how)}；不是你家門口，實際距離會有出入。</div>`;
  document.getElementById('out').innerHTML=h;
  document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'});
}

// 頁尾：假設與出處
const sp = Object.entries(D.drive_speeds).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
